name: Build iStore OS 6.x

on:
  repository_dispatch:

  workflow_dispatch:
    inputs:
      build_firmware:
        description: '是否编译固件'
        required: true
        default: true
        type: boolean

  schedule:
    # UTC 17:00 = 北京/新加坡时间凌晨 01:00
    - cron: '0 17 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10

  CONFIG_FILE: armv8/.config
  FEEDS_FILE: armv8/feeds.conf
  PACKAGE_CONFIG: configfiles/config_data-6.x.txt

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  # 使用 GitHub Actions 100G 独立工作磁盘
  WORKDIR: ${{ github.workspace }}
  OPENWRT_DIR: ${{ github.workspace }}/istoreos

  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai

  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # =========================================================
    # 1. 合并磁盘
    # =========================================================
    - name: 合并磁盘
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    # =========================================================
    # 2. 检出配置仓库
    # =========================================================
    - name: 检出配置文件
      uses: actions/checkout@v4

    # =========================================================
    # 3. 清理 Runner
    # =========================================================
    - name: 清理系统磁盘空间
      shell: bash
      run: |
        set +e

        echo "=========================================="
        echo "清理 GitHub Actions Runner"
        echo "=========================================="

        echo "========== 清理前 =========="
        df -hT
        df -ih

        sudo apt-get -y purge firefox || true
        sudo apt-get remove -y '^dotnet-.*' || true
        sudo apt-get remove -y '^llvm-.*' || true
        sudo apt-get remove -y 'php.*' || true
        sudo apt-get remove -y '^mongodb-.*' || true
        sudo apt-get remove -y '^mysql-.*' || true

        sudo apt-get remove -y \
          azure-cli \
          google-cloud-sdk \
          hhvm \
          google-chrome-stable \
          firefox \
          powershell \
          mono-devel || true

        sudo apt-get autoremove --purge -y || true
        sudo apt-get autoclean -y || true
        sudo apt-get clean || true

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost

        docker system prune -af --volumes || true

        sudo rm -rf /opt/hostedtoolcache

        echo "========== 清理完成 =========="
        df -hT
        df -ih

    # =========================================================
    # 4. 检查服务器
    # =========================================================
    - name: 检查服务器配置
      run: |
        echo "========== CPU =========="
        nproc
        lscpu | grep -E 'Model name|CPU\(s\)' || true

        echo "========== 内存 =========="
        free -h

        echo "========== 磁盘 =========="
        df -hT

        echo "========== inode =========="
        df -ih

        echo "========== GitHub Workspace =========="
        echo "$GITHUB_WORKSPACE"

        echo "========== Workspace 磁盘 =========="
        df -h "$GITHUB_WORKSPACE"

    # =========================================================
    # 5. 初始化编译环境
    # =========================================================
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "========== 安装编译依赖 =========="

        sudo rm -rf \
          /etc/apt/sources.list.d/* \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php \
          /usr/local/lib/android \
          /opt/ghc

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          p7zip \
          patch \
          pkg-config \
          python3 \
          python3-dev \
          python3-pip \
          qemu-utils \
          rsync \
          scons \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          unzip \
          upx-ucl \
          uuid-dev \
          wget \
          xsltproc \
          zlib1g-dev

        sudo pip3 install --upgrade pip
        sudo pip3 install pyelftools

        sudo timedatectl set-timezone "$TZ"

        echo "========== 编译环境完成 =========="
        df -h "$GITHUB_WORKSPACE"

    # =========================================================
    # 6. 创建工作目录
    # =========================================================
    - name: 创建工作目录
      run: |
        mkdir -p "$WORKDIR"

        echo "WORKDIR_PATH=$WORKDIR" >> "$GITHUB_ENV"

        echo "工作目录：$WORKDIR"
        df -h "$WORKDIR"

    # =========================================================
    # 7. 克隆 iStoreOS
    # =========================================================
    - name: 克隆源码
      working-directory: ${{ env.WORKDIR }}
      run: |
        echo "========== 克隆 iStoreOS =========="

        rm -rf "$OPENWRT_DIR"

        git clone --depth=1 \
          "$REPO_URL" \
          -b "$REPO_BRANCH" \
          istoreos

        echo "源码目录：$OPENWRT_DIR"

        echo "========== 源码所在磁盘 =========="
        df -h "$OPENWRT_DIR"

    # =========================================================
    # 8. 检查配置文件
    # =========================================================
    - name: 检查配置文件
      run: |
        echo "========== 检查自定义文件 =========="

        test -f "$CONFIG_FILE" || {
          echo "ERROR: 找不到 $CONFIG_FILE"
          exit 1
        }

        test -f "$FEEDS_FILE" || {
          echo "ERROR: 找不到 $FEEDS_FILE"
          exit 1
        }

        test -f "$PACKAGE_CONFIG" || {
          echo "ERROR: 找不到 $PACKAGE_CONFIG"
          exit 1
        }

        test -f "$DIY_P1_SH" || {
          echo "ERROR: 找不到 $DIY_P1_SH"
          exit 1
        }

        test -f "$DIY_P2_SH" || {
          echo "ERROR: 找不到 $DIY_P2_SH"
          exit 1
        }

        echo "所有配置文件检查通过"

    # =========================================================
    # 9. 加载 feeds
    # =========================================================
    - name: 加载 feeds
      run: |
        cp "$FEEDS_FILE" "$OPENWRT_DIR/feeds.conf"

        echo "feeds.conf 已加载"

        echo "========== feeds.conf =========="
        cat "$OPENWRT_DIR/feeds.conf"

    # =========================================================
    # 10. DIY Part 1
    # =========================================================
    - name: 执行 DIY Part 1
      run: |
        chmod +x "$DIY_P1_SH"

        cd "$OPENWRT_DIR"

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # =========================================================
    # 11. 更新 feeds
    # =========================================================
    - name: 更新 feeds
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 更新 feeds =========="

        ./scripts/feeds update -a

    # =========================================================
    # 12. 安装 feeds
    # =========================================================
    - name: 安装 feeds
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 安装 feeds =========="

        ./scripts/feeds install -a

    # =========================================================
    # 13. 加载配置
    # =========================================================
    - name: 加载配置
      run: |
        echo "========== 加载主配置 =========="

        cp "$CONFIG_FILE" "$OPENWRT_DIR/.config"

        mkdir -p "$OPENWRT_DIR/configfiles"

        cp "$PACKAGE_CONFIG" \
          "$OPENWRT_DIR/configfiles/config_data-6.x.txt"

        echo "主配置：$OPENWRT_DIR/.config"
        echo "插件配置：$OPENWRT_DIR/configfiles/config_data-6.x.txt"

    # =========================================================
    # 14. DIY Part 2
    # =========================================================
    - name: 执行 DIY Part 2
      run: |
        chmod +x "$DIY_P2_SH"

        cd "$OPENWRT_DIR"

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # =========================================================
    # 15. 生成最终配置
    # =========================================================
    - name: 生成最终配置
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== make defconfig =========="

        make defconfig

        echo "========== 检查目标设备 =========="

        COUNT=$(grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config | wc -l)

        echo "检测到 Rockchip ARM64 设备数量：$COUNT"

        if [ "$COUNT" -ne 1 ]; then
          echo "ERROR: Rockchip ARM64 目标设备不是唯一设备"

          grep \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config || true

          exit 1
        fi

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config

        echo "========== 最终 .config =========="

        grep '^CONFIG_TARGET_' .config | head -50

        cp .config "$GITHUB_WORKSPACE/final.config"

    # =========================================================
    # 16. 上传最终 .config
    # =========================================================
    - name: 上传最终 .config
      uses: actions/upload-artifact@v4
      with:
        name: final-config
        path: final.config
        retention-days: 30

    # =========================================================
    # 17. 上传编译配置
    # =========================================================
    - name: 上传配置文件
      uses: actions/upload-artifact@v4
      with:
        name: build-config
        path: |
          ${{ env.OPENWRT_DIR }}/.config
          ${{ env.OPENWRT_DIR }}/feeds.conf
          ${{ env.PACKAGE_CONFIG }}
        retention-days: 30

    # =========================================================
    # 18. 编译缓存
    # =========================================================
    - name: 缓存编译
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: istoreos-${{ env.REPO_BRANCH }}-armv8
        prefix: ${{ env.OPENWRT_DIR }}

    # =========================================================
    # 19. 检查编译空间
    # =========================================================
    - name: 检查编译空间
      run: |
        echo "=========================================="
        echo "编译前磁盘状态"
        echo "=========================================="

        df -hT "$GITHUB_WORKSPACE"
        df -ih "$GITHUB_WORKSPACE"

        echo "========== 根分区 =========="
        df -hT /

        echo "========== OpenWrt 目录 =========="
        du -sh "$OPENWRT_DIR" 2>/dev/null || true

        echo "========== ccache =========="
        if command -v ccache >/dev/null 2>&1; then
          ccache -s || true
        fi

    # =========================================================
    # 20. 下载软件包
    # =========================================================
    - name: 下载软件包
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 下载软件包 =========="

        df -h "$GITHUB_WORKSPACE"

        make download -j8

        echo "========== 检查异常小文件 =========="

        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

        echo "========== 下载完成 =========="

        df -h "$GITHUB_WORKSPACE"

    # =========================================================
    # 21. 编译固件
    # =========================================================
    - name: 编译固件
      id: compile
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
      working-directory: ${{ env.OPENWRT_DIR }}
      shell: bash
      run: |
        set -o pipefail

        echo "=========================================="
        echo "开始编译 iStoreOS"
        echo "=========================================="

        echo "CPU线程：$(nproc)"
        echo "开始时间：$(date)"

        echo "========== 编译前磁盘 =========="
        df -hT "$GITHUB_WORKSPACE"
        df -ih "$GITHUB_WORKSPACE"

        echo "========== 并行编译 =========="

        if make -j"$(nproc)"; then

          echo "并行编译成功"

        else

          echo "=========================================="
          echo "并行编译失败"
          echo "开始单线程编译"
          echo "=========================================="

          df -hT "$GITHUB_WORKSPACE"
          df -ih "$GITHUB_WORKSPACE"

          if make -j1; then

            echo "单线程编译成功"

          else

            echo "=========================================="
            echo "单线程编译失败"
            echo "开始详细日志编译"
            echo "=========================================="

            df -hT "$GITHUB_WORKSPACE"
            df -ih "$GITHUB_WORKSPACE"

            make -j1 V=s
          fi
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "=========================================="
        echo "编译成功"
        echo "结束时间：$(date)"
        echo "=========================================="

        df -hT "$GITHUB_WORKSPACE"

    # =========================================================
    # 22. 检查编译结果
    # =========================================================
    - name: 检查编译结果
      if: steps.compile.outputs.status == 'success'
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 编译结果 =========="

        find bin/targets -type f | sort

    # =========================================================
    # 23. 查找 KO 驱动
    # =========================================================
    - name: 查找 KO 驱动
      if: steps.compile.outputs.status == 'success'
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== KO 驱动 =========="

        find . -type f -name "*.ko" | head -200

    # =========================================================
    # 24. 检查磁盘空间
    # =========================================================
    - name: 检查磁盘空间
      if: always()
      run: |
        echo "=========================================="
        echo "最终磁盘空间"
        echo "=========================================="

        df -hT
        df -ih

        echo "========== Workspace =========="

        df -hT "$GITHUB_WORKSPACE"

        echo "========== OpenWrt 大目录 =========="

        du -xh "$OPENWRT_DIR" 2>/dev/null \
          | sort -h \
          | tail -30 || true

    # =========================================================
    # 25. 上传 bin
    # =========================================================
    - name: 上传 bin 文件夹
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_bin${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_DIR }}/bin
        retention-days: 30

    # =========================================================
    # 26. 整理固件
    # =========================================================
    - name: 整理固件
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        echo "========== 整理固件 =========="

        FIRMWARE_DIR=$(find \
          "$OPENWRT_DIR/bin/targets" \
          -mindepth 2 \
          -maxdepth 2 \
          -type d \
          | head -1)

        if [ -z "$FIRMWARE_DIR" ]; then
          echo "ERROR: 找不到固件目录"
          exit 1
        fi

        cd "$FIRMWARE_DIR"

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "========== 固件目录 =========="
        echo "$PWD"

        echo "========== 固件文件 =========="
        ls -lh

    # =========================================================
    # 27. 上传固件 Artifact
    # =========================================================
    - name: 上传固件目录
      if: steps.organize.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30

    # =========================================================
    # 28. 生成 Release 信息
    # =========================================================
    - name: 生成发布信息
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        TAG="$(date +"%Y.%m.%d-%H.%M")-armv8"

        echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

        cat > release.txt <<EOF
        ## iStoreOS 6.x

        - 架构：armv8
        - 源码：$REPO_URL
        - 分支：$REPO_BRANCH
        - 编译时间：$(date +"%Y-%m-%d %H:%M")
        - 管理地址：192.168.100.1
        - 用户名：root
        - 密码：password

        本版本为 Rockchip ARM64 / Hinlink H68K 云编译版本。
        EOF

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 29. 发布 Release
    # =========================================================
    - name: 发布固件
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # =========================================================
    # 30. 删除旧 Workflow
    # =========================================================
    - name: 删除旧 Workflow
      uses: xiaomeng9597/delete-workflow-runs@main
      if: always()
      with:
        retain_days: 20
        keep_minimum_runs: 15
        token: ${{ env.GITHUB_TOKEN }}

    # =========================================================
    # 31. 删除旧 Releases
    # =========================================================
    - name: 删除旧 Releases
      if: env.UPLOAD_RELEASE == 'true'
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 60
        delete_tags: true
        keep_min_download_counts: 0
        delete_expired_data: 0
        delete_prerelease_only: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
