name: iStoreOS H6XK

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      BUILD_MODE:
        description: "编译模式"
        required: true
        default: build_firmware
        type: choice
        options:
          - build_firmware
          - generate_config
  repository_dispatch:
  schedule:
    - cron: '0 17 * * *'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  CONFIG_FILE: armv8/.config
  FEEDS_FILE: armv8/feeds.conf
  PACKAGE_CONFIG: configfiles/config_data-6.x.txt
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  WORKDIR: /workdir
  OPENWRT_DIR: /workdir/istoreos
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出配置
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool \
            lib32gcc-dev libc6-dev-i386 libelf-dev libffi-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libtool make ninja-build \
            p7zip patch pkg-config python3 python3-dev python3-pip \
            qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo unzip upx-ucl uuid-dev wget xsltproc zlib1g-dev

      - name: 检查文件
        run: |
          set -e
          for f in "$CONFIG_FILE" "$FEEDS_FILE" "$PACKAGE_CONFIG" "$DIY_P1_SH" "$DIY_P2_SH"; do
            test -f "$f"
          done

      - name: 克隆 iStoreOS
        run: |
          mkdir -p "$WORKDIR"
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" "$OPENWRT_DIR"

      - name: 导入 feeds
        run: |
          cp "$GITHUB_WORKSPACE/$FEEDS_FILE" "$OPENWRT_DIR/feeds.conf"

      - name: DIY Part 1
        run: |
          cd "$OPENWRT_DIR"
          cp "$GITHUB_WORKSPACE/$DIY_P1_SH" .
          chmod +x "$DIY_P1_SH"
          ./"$DIY_P1_SH"

      - name: 更新 feeds
        run: |
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY Part 2
        run: |
          cd "$OPENWRT_DIR"
          cp "$GITHUB_WORKSPACE/$DIY_P2_SH" .
          chmod +x "$DIY_P2_SH"
          ./"$DIY_P2_SH"

      - name: 生成最终配置
        run: |
          set -e
          cd "$OPENWRT_DIR"

          cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
          cat "$GITHUB_WORKSPACE/$PACKAGE_CONFIG" >> .config

          cat >> .config <<'EOF'
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

          make defconfig

          COUNT=$(grep '^CONFIG_TARGET_DEVICE_rockchip_rk35xx_DEVICE_.*=y$' .config | wc -l)

          echo "RK35xx 设备数量：$COUNT"
          grep '^CONFIG_TARGET_DEVICE_rockchip_rk35xx_DEVICE_' .config || true

          [ "$COUNT" -eq 1 ] || {
            echo "ERROR: RK35xx 设备必须且只能选择一个"
            exit 1
          }

          grep -q '^CONFIG_TARGET_DEVICE_rockchip_rk35xx_DEVICE_hinlink_opc-h6xk=y$' .config || {
            echo "ERROR: 目标不是 Hinlink H6XK"
            exit 1
          }

          cp .config "$GITHUB_WORKSPACE/h6xk-final.config"

          [ ! -f config.buildinfo ] || \
            cp config.buildinfo "$GITHUB_WORKSPACE/h6xk-config.buildinfo"

      - name: 上传最终配置
        uses: actions/upload-artifact@v4
        with:
          name: h6xk-final-config
          path: |
            h6xk-final.config
            h6xk-config.buildinfo
          if-no-files-found: warn
          retention-days: 30

      - name: 配置模式结束
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.BUILD_MODE == 'generate_config' }}
        run: echo "最终 .config 已生成，跳过固件编译"

      - name: 编译缓存
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        uses: actions/cache@v4
        with:
          path: |
            /workdir/istoreos/.ccache
            /workdir/istoreos/staging_dir
          key: ${{ runner.os }}-h6xk-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-h6xk-

      - name: 下载源码包
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        run: |
          cd "$OPENWRT_DIR"
          make download -j8 V=s

      - name: 编译
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        run: |
          cd "$OPENWRT_DIR"
          make -j$(nproc) || make -j1 V=s

      - name: 整理固件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        run: |
          cd "$OPENWRT_DIR/bin/targets/rockchip/rk35xx"
          rm -rf packages
          find . -maxdepth 1 -type f ! -name '*.img.gz' -delete

          for f in *.img.gz; do
            [ -f "$f" ] || continue
            n="${f#istoreos-}"
            n="${n#openwrt-}"
            [ "$f" = "$n" ] || mv "$f" "$n"
          done

          test -n "$(find . -maxdepth 1 -type f -name '*.img.gz' -print -quit)"

      - name: 上传固件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-H6XK
          path: /workdir/istoreos/bin/targets/rockchip/rk35xx/*.img.gz
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.BUILD_MODE == 'build_firmware' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: iStoreOS-H6XK-${{ github.run_number }}
          name: iStoreOS H6XK ${{ github.run_number }}
          body: |
            Target: hinlink_opc-h6xk
            Branch: istoreos-24.10
          files: /workdir/istoreos/bin/targets/rockchip/rk35xx/*.img.gz
