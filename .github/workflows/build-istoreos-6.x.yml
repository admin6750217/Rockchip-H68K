name: Build iStore OS 6.x

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      build_firmware:
        description: '是否编译固件'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10

  CONFIG_FILE: armv8/.config
  FEEDS_FILE: armv8/feeds.conf
  PACKAGE_CONFIG: configfiles/config_data-6.x.txt

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  WORKDIR: /workdir
  OPENWRT_DIR: /workdir/istoreos

  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 合并磁盘
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: 检出配置文件
        uses: actions/checkout@v4

      - name: 清理系统空间
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== 磁盘空间 ====="
          df -hT
          df -ih

      - name: 安装编译依赖
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time \
            xsltproc \
            swig \
            gettext-base \
            quilt \
            libelf-dev \
            ccache

          sudo apt-get clean

      - name: 准备编译目录
        run: |
          sudo mkdir -p "$WORKDIR"
          sudo chown -R "$USER:$USER" "$WORKDIR"
          rm -rf "$OPENWRT_DIR"

          echo "===== /workdir ====="
          df -hT "$WORKDIR"
          df -ih "$WORKDIR"

          echo "===== Workspace ====="
          df -hT "$GITHUB_WORKSPACE"
          df -ih "$GITHUB_WORKSPACE"

      - name: 下载 iStoreOS
        run: |
          git clone \
            --depth=1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            "$OPENWRT_DIR"

          cd "$OPENWRT_DIR"

          git log -1 --oneline

          echo "===== 实际编译目录 ====="
          readlink -f "$OPENWRT_DIR"
          df -hT "$OPENWRT_DIR"
          df -ih "$OPENWRT_DIR"

      - name: 配置 feeds
        run: |
          cd "$OPENWRT_DIR"

          test -f "$GITHUB_WORKSPACE/$FEEDS_FILE"

          cp "$GITHUB_WORKSPACE/$FEEDS_FILE" feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置文件
        run: |
          cd "$OPENWRT_DIR"

          test -f "$GITHUB_WORKSPACE/$CONFIG_FILE"

          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          if [ -f "$GITHUB_WORKSPACE/$PACKAGE_CONFIG" ]; then
            cat "$GITHUB_WORKSPACE/$PACKAGE_CONFIG" >> .config
          fi

      - name: 执行 DIY Part1
        run: |
          cd "$OPENWRT_DIR"

          if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
            cp "$GITHUB_WORKSPACE/$DIY_P1_SH" diy-part1.sh
            chmod +x diy-part1.sh
            ./diy-part1.sh
          fi

      - name: 执行 DIY Part2
        run: |
          cd "$OPENWRT_DIR"

          if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
            cp "$GITHUB_WORKSPACE/$DIY_P2_SH" diy-part2.sh
            chmod +x diy-part2.sh
            ./diy-part2.sh
          fi

      - name: 生成最终配置
        run: |
          cd "$OPENWRT_DIR"

          make defconfig

          echo "===== 最终目标设备 ====="
          grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' .config || true

          COUNT=$(grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' .config | wc -l)

          echo "检测到 Rockchip ARM64 设备数量：$COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Rockchip ARM64 目标设备不是唯一设备"
            exit 1
          fi

      - name: 上传最终配置
        uses: actions/upload-artifact@v4
        with:
          name: final-config
          path: ${{ env.OPENWRT_DIR }}/.config
          retention-days: 7

      - name: 编译缓存
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true

      - name: 编译前检查磁盘
        run: |
          cd "$OPENWRT_DIR"

          echo "===== 编译目录 ====="
          df -hT .
          df -ih .

          echo "===== /workdir ====="
          df -hT "$WORKDIR"
          df -ih "$WORKDIR"

          echo "===== Workspace ====="
          df -hT "$GITHUB_WORKSPACE"
          df -ih "$GITHUB_WORKSPACE"

          echo "===== 根分区 ====="
          df -hT /
          df -ih /

      - name: 下载源码包
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
        run: |
          cd "$OPENWRT_DIR"

          make download -j8

          find dl -type f -size -1024c -print -delete || true

      - name: 编译固件
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
        run: |
          cd "$OPENWRT_DIR"

          echo "===== 开始编译 ====="
          echo "CPU: $(nproc)"
          echo "===== 内存 ====="
          free -h
          echo "===== 磁盘 ====="
          df -hT .
          df -ih .

          make -j"$(nproc)"

      - name: 编译失败后单线程重试
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.build_firmware) }}
        run: |
          cd "$OPENWRT_DIR"

          echo "===== 多线程编译失败，开始单线程详细编译 ====="

          make -j1 V=s

      - name: 编译后检查磁盘
        if: always()
        run: |
          echo "===== /workdir ====="
          df -hT "$WORKDIR"
          df -ih "$WORKDIR"

          echo "===== Workspace ====="
          df -hT "$GITHUB_WORKSPACE"
          df -ih "$GITHUB_WORKSPACE"

          echo "===== 根分区 ====="
          df -hT /
          df -ih /

      - name: 整理固件
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_firmware) }}
        run: |
          cd "$OPENWRT_DIR/bin/targets/"*/*

          rm -rf packages

          find . -maxdepth 1 -type f \
            ! -name '*.img.gz' \
            ! -name '*.manifest' \
            ! -name 'sha256sums' \
            -delete

          test -n "$(find . -maxdepth 1 -type f -name '*.img.gz' -print -quit)"

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

          echo "===== 固件 ====="
          ls -lh

      - name: 上传 bin 目录
        if: ${{ success() && env.UPLOAD_BIN_DIR == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_firmware) }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-6.x-bin
          path: ${{ env.OPENWRT_DIR }}/bin/targets/
          retention-days: 7

      - name: 上传固件
        if: ${{ success() && env.UPLOAD_FIRMWARE == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_firmware) }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-6.x-firmware
          path: |
            ${{ env.FIRMWARE }}/*.img.gz
            ${{ env.FIRMWARE }}/sha256sums
          if-no-files-found: error
          retention-days: 7

      - name: 发布 Release
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_firmware) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('{0}-armv8', github.run_number) }}
          name: iStoreOS 6.x ARMv8 Build ${{ github.run_number }}
          body: |
            iStoreOS 6.x ARMv8 自动编译

            管理地址：192.168.100.1
            用户名：root
            密码：password

            架构：ARMv8
            分支：istoreos-24.10

            GitHub Actions Run：
            ${{ github.run_number }}
          files: |
            ${{ env.FIRMWARE }}/*.img.gz
            ${{ env.FIRMWARE }}/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 删除旧 Actions
        if: always()
        continue-on-error: true
        run: |
          echo "保留最近 20 次 Actions 运行记录"

          gh run list \
            --limit 100 \
            --json databaseId \
            --jq '.[20:] | .[].databaseId' |
          while read -r id; do
            [ -n "$id" ] && gh run delete "$id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 删除旧 Release
        if: always()
        continue-on-error: true
        run: |
          echo "保留最近 20 个 Release"

          gh release list \
            --limit 100 \
            --json tagName,isLatest \
            --jq '.[20:] | .[].tagName' |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
