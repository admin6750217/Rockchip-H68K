name: Build iStore OS 6.x

on:
  repository_dispatch:

  workflow_dispatch:
    inputs:
      build_firmware:
        description: '是否编译固件'
        required: true
        default: true
        type: boolean

  schedule:
    # UTC 17:00 = 北京/新加坡时间凌晨 01:00
    - cron: '0 17 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10

  CONFIG_FILE: armv8/.config
  FEEDS_FILE: armv8/feeds.conf
  PACKAGE_CONFIG: configfiles/config_data-6.x.txt

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  WORKDIR: /workdir
  OPENWRT_DIR: /workdir/istoreos

  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

    - name: 合并磁盘
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: 检出配置文件
      uses: actions/checkout@v4

    - name: 清理 CI 环境
      shell: bash
      run: |
        set +e

        echo "=============================================================================="
        echo "清理 GitHub Actions Runner 磁盘空间"
        echo "=============================================================================="

        echo "========== 当前磁盘空间 =========="
        df -hT
        df -ih

        echo "========== 最大的软件包 =========="

        dpkg-query -Wf '${Installed-Size}\t${Package}\n' 2>/dev/null \
          | sort -n \
          | tail -n 100 || true

        echo "========== 删除大型软件包 =========="

        sudo apt-get -y purge firefox || true

        sudo apt-get remove -y '^dotnet-.*' || true
        sudo apt-get remove -y '^llvm-.*' || true
        sudo apt-get remove -y 'php.*' || true
        sudo apt-get remove -y '^mongodb-.*' || true
        sudo apt-get remove -y '^mysql-.*' || true

        sudo apt-get remove -y \
          azure-cli \
          google-cloud-sdk \
          hhvm \
          google-chrome-stable \
          powershell \
          mono-devel || true

        echo "========== 清理 APT =========="

        sudo apt-get autoremove --purge -y || true
        sudo apt-get autoclean -y || true
        sudo apt-get clean || true

        echo "========== 删除大型目录 =========="

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache

        echo "========== 清理 Docker =========="

        docker system prune -af --volumes || true

        echo "========== 清理完成 =========="

        df -hT
        df -ih

    - name: 检查服务器配置
      run: |
        echo "========== CPU =========="

        nproc

        lscpu | grep -E 'Model name|CPU\(s\)' || true

        echo "========== 内存 =========="

        free -h

        echo "========== 磁盘 =========="

        df -hT
        df -ih

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "========== 安装编译依赖 =========="

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          python3 \
          python3-dev \
          python3-distutils \
          python3-pip \
          python3-setuptools \
          qemu-utils \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          jq \
          time \
          xsltproc \
          swig \
          gettext-base \
          quilt \
          libelf-dev \
          ccache \
          pkg-config \
          patch \
          subversion \
          squashfs-tools \
          uuid-dev \
          scons \
          texinfo

        sudo pip3 install --upgrade pip
        sudo pip3 install pyelftools

        sudo timedatectl set-timezone "$TZ"

        sudo apt-get clean

        echo "========== 编译环境完成 =========="

    - name: 创建工作目录
      run: |
        sudo mkdir -p "$WORKDIR"
        sudo chown -R "$USER:$USER" "$WORKDIR"

        echo "WORKDIR_PATH=$WORKDIR" >> "$GITHUB_ENV"

        echo "========== 工作目录 =========="

        echo "$WORKDIR"

        df -hT "$WORKDIR"
        df -ih "$WORKDIR"

    - name: 克隆 iStoreOS
      working-directory: ${{ env.WORKDIR }}
      run: |
        echo "========== 克隆 iStoreOS =========="

        git clone \
          --depth=1 \
          --branch "$REPO_BRANCH" \
          "$REPO_URL" \
          istoreos

        echo "========== 源码信息 =========="

        cd "$OPENWRT_DIR"

        git log -1 --oneline

        echo "源码目录："
        readlink -f "$OPENWRT_DIR"

        echo "========== 源码磁盘 =========="

        df -hT "$OPENWRT_DIR"
        df -ih "$OPENWRT_DIR"

    - name: 检查配置文件
      run: |
        echo "========== 检查自定义文件 =========="

        test -f "$CONFIG_FILE" || {
          echo "ERROR: 找不到 $CONFIG_FILE"
          exit 1
        }

        test -f "$FEEDS_FILE" || {
          echo "ERROR: 找不到 $FEEDS_FILE"
          exit 1
        }

        test -f "$PACKAGE_CONFIG" || {
          echo "ERROR: 找不到 $PACKAGE_CONFIG"
          exit 1
        }

        test -f "$DIY_P1_SH" || {
          echo "ERROR: 找不到 $DIY_P1_SH"
          exit 1
        }

        test -f "$DIY_P2_SH" || {
          echo "ERROR: 找不到 $DIY_P2_SH"
          exit 1
        }

        echo "=========================================="
        echo "所有配置文件检查通过"
        echo "=========================================="

    - name: 加载 feeds
      run: |
        echo "========== 加载 feeds.conf =========="

        cp "$FEEDS_FILE" "$OPENWRT_DIR/feeds.conf"

        echo "========== 当前 feeds.conf =========="

        cat "$OPENWRT_DIR/feeds.conf"

    - name: 执行 DIY Part 1
      shell: bash
      run: |
        echo "========== 执行 DIY Part 1 =========="

        chmod +x "$DIY_P1_SH"

        cd "$OPENWRT_DIR"

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 更新 feeds
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 更新 feeds =========="

        ./scripts/feeds update -a

    - name: 安装 feeds
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 安装 feeds =========="

        ./scripts/feeds install -a

    - name: 加载配置
      run: |
        echo "========== 加载主配置 =========="

        cp "$CONFIG_FILE" "$OPENWRT_DIR/.config"

        mkdir -p "$OPENWRT_DIR/configfiles"

        cp "$PACKAGE_CONFIG" \
          "$OPENWRT_DIR/configfiles/config_data-6.x.txt"

        echo "主配置："
        echo "$OPENWRT_DIR/.config"

        echo "插件配置："
        echo "$OPENWRT_DIR/configfiles/config_data-6.x.txt"

    - name: 执行 DIY Part 2
      shell: bash
      run: |
        echo "========== 执行 DIY Part 2 =========="

        chmod +x "$DIY_P2_SH"

        cd "$OPENWRT_DIR"

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: 生成最终配置
      working-directory: ${{ env.OPENWRT_DIR }}
      shell: bash
      run: |
        echo "=========================================="
        echo "生成最终 .config"
        echo "=========================================="

        make defconfig

        echo "========== 检查目标设备 =========="

        COUNT=$(grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config | wc -l)

        echo "检测到 Rockchip ARM64 设备数量：$COUNT"

        if [ "$COUNT" -ne 1 ]; then

          echo "ERROR: Rockchip ARM64 目标设备不是唯一设备"

          grep \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config || true

          exit 1

        fi

        echo "========== 目标设备 =========="

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config

        echo "========== Target 配置 =========="

        grep '^CONFIG_TARGET_' .config | head -100 || true

        cp .config "$GITHUB_WORKSPACE/final.config"

    - name: 上传最终 .config
      uses: actions/upload-artifact@v4
      with:
        name: final-config
        path: final.config
        retention-days: 30

    - name: 上传配置文件
      uses: actions/upload-artifact@v4
      with:
        name: build-config
        path: |
          ${{ env.OPENWRT_DIR }}/.config
          ${{ env.OPENWRT_DIR }}/feeds.conf
          ${{ env.PACKAGE_CONFIG }}
        retention-days: 30

    - name: 缓存编译
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        toolchain: 'true'
        mixkey: istoreos-${{ env.REPO_BRANCH }}-armv8
        prefix: ${{ env.OPENWRT_DIR }}

    - name: 编译前检查磁盘
      run: |
        echo "========== /workdir =========="

        df -hT "$WORKDIR"
        df -ih "$WORKDIR"

        echo "========== iStoreOS =========="

        df -hT "$OPENWRT_DIR"
        df -ih "$OPENWRT_DIR"

        echo "========== Workspace =========="

        df -hT "$GITHUB_WORKSPACE"
        df -ih "$GITHUB_WORKSPACE"

        echo "========== 根分区 =========="

        df -hT /
        df -ih /

        echo "========== 内存 =========="

        free -h

    - name: 下载软件包
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
      working-directory: ${{ env.OPENWRT_DIR }}
      shell: bash
      run: |
        echo "=========================================="
        echo "下载 iStoreOS 软件包"
        echo "=========================================="

        make download -j8

        echo "========== 检查异常小文件 =========="

        find dl \
          -type f \
          -size -1024c \
          -print \
          -delete || true

        echo "软件包下载完成"

    - name: 编译固件
      id: compile
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware }}
      working-directory: ${{ env.OPENWRT_DIR }}
      shell: bash
      run: |
        echo "=========================================="
        echo "开始编译 iStoreOS 6.x"
        echo "=========================================="

        echo "CPU线程：$(nproc)"
        echo "开始时间：$(date)"

        echo "========== 内存 =========="

        free -h

        echo "========== 磁盘 =========="

        df -hT .
        df -ih .

        echo "=========================================="
        echo "第一阶段：多线程编译"
        echo "=========================================="

        if make -j"$(nproc)"; then

          echo "=========================================="
          echo "多线程编译成功"
          echo "=========================================="

        else

          echo "=========================================="
          echo "多线程编译失败"
          echo "第二阶段：单线程编译"
          echo "=========================================="

          if make -j1; then

            echo "=========================================="
            echo "单线程编译成功"
            echo "=========================================="

          else

            echo "=========================================="
            echo "单线程编译失败"
            echo "第三阶段：单线程详细日志"
            echo "=========================================="

            make -j1 V=s

          fi

        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "=========================================="
        echo "编译成功"
        echo "结束时间：$(date)"
        echo "=========================================="

    - name: 检查编译结果
      if: steps.compile.outputs.status == 'success'
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== 编译结果 =========="

        find bin/targets \
          -type f \
          | sort

    - name: 查找 KO 驱动
      if: steps.compile.outputs.status == 'success'
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        echo "========== KO 驱动 =========="

        find . \
          -type f \
          -name "*.ko" \
          | head -200 || true

    - name: 编译后检查磁盘
      if: always()
      run: |
        echo "========== /workdir =========="

        df -hT "$WORKDIR"
        df -ih "$WORKDIR"

        echo "========== Workspace =========="

        df -hT "$GITHUB_WORKSPACE"
        df -ih "$GITHUB_WORKSPACE"

        echo "========== 根分区 =========="

        df -hT /
        df -ih /

    - name: 上传 bin 文件夹
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-6.x-bin${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_DIR }}/bin
        retention-days: 30

    - name: 整理固件
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      shell: bash
      run: |
        echo "=========================================="
        echo "整理 iStoreOS 固件"
        echo "=========================================="

        FIRMWARE_DIR=$(find \
          "$OPENWRT_DIR/bin/targets" \
          -mindepth 2 \
          -maxdepth 2 \
          -type d \
          | head -1)

        if [ -z "$FIRMWARE_DIR" ]; then

          echo "ERROR: 找不到固件目录"

          find "$OPENWRT_DIR/bin/targets" \
            -maxdepth 3 \
            -type d \
            -print || true

          exit 1

        fi

        cd "$FIRMWARE_DIR"

        echo "固件目录：$PWD"

        rm -rf packages

        echo "========== 删除无用文件 =========="

        find . \
          -maxdepth 1 \
          -type f \
          ! -name '*.img.gz' \
          ! -name '*.manifest' \
          ! -name 'sha256sums' \
          -delete

        echo "========== 检查固件 =========="

        if ! find . \
          -maxdepth 1 \
          -type f \
          -name '*.img.gz' \
          -print \
          -quit \
          | grep -q .; then

          echo "ERROR: 未找到 .img.gz 固件"

          ls -lah

          exit 1

        fi

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "========== 固件文件 =========="

        ls -lh

    - name: 上传固件目录
      if: steps.organize.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-6.x-firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30

    - name: 生成发布信息
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      shell: bash
      run: |
        TAG="$(date +"%Y.%m.%d-%H.%M")-armv8"

        echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

        cat > release.txt <<EOF
        ## iStoreOS 6.x ARMv8

        - 架构：ARMv8
        - 平台：Rockchip ARM64
        - 源码：$REPO_URL
        - 分支：$REPO_BRANCH
        - 编译时间：$(date +"%Y-%m-%d %H:%M")
        - 管理地址：192.168.100.1
        - 用户名：root
        - 密码：password

        本版本为 iStoreOS 6.x Rockchip ARM64 云编译版本。

        GitHub Actions Run：
        ${{ github.run_number }}
        EOF

        echo "========== Release Tag =========="

        echo "$TAG"

        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 发布固件
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: iStoreOS 6.x ARMv8 ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/sha256sums
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 删除旧 Workflow
      uses: xiaomeng9597/delete-workflow-runs@main
      if: always()
      continue-on-error: true
      with:
        retain_days: 20
        keep_minimum_runs: 15
        token: ${{ env.GITHUB_TOKEN }}

    - name: 删除旧 Releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true'
      continue-on-error: true
      with:
        keep_latest: 60
        delete_tags: true
        keep_min_download_counts: 0
        delete_expired_data: 0
        delete_prerelease_only: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
